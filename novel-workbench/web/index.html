<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#fbf7ef" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#17140f" media="(prefers-color-scheme: dark)">
  <title>书房 · 签约工作台</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <a class="skip-link" href="#view">跳到正文</a>

  <header class="topbar">
    <a class="brand" href="#/" aria-label="回到书房">
      <span class="brand-seal" aria-hidden="true">签</span>
      <span class="brand-copy">
        <strong>书房</strong>
        <small>签约工作台</small>
      </span>
    </a>
    <div id="context" class="context" aria-live="polite"></div>
    <div class="top-actions">
      <small class="entry-hint">桌面端体验更佳</small>
      <a class="text-link" href="#/settings">设置</a>
    </div>
  </header>

  <div class="app-shell">
    <aside class="rail" aria-label="主导航">
      <nav id="railNav" class="rail-nav"></nav>
      <div id="railBook" class="rail-book"></div>
    </aside>
    <main id="view" class="view" tabindex="-1"></main>
  </div>

  <nav id="bottomNav" class="bottom-nav" aria-label="移动端导航"></nav>

  <div id="toastRegion" class="toast-region" role="status" aria-live="polite" aria-atomic="true"></div>

  <dialog id="newBookDialog" class="dialog" aria-labelledby="newBookTitle">
    <form id="newBookForm" method="dialog">
      <header class="dialog-head">
        <h2 id="newBookTitle">开一本新书</h2>
        <button class="icon-button" type="button" id="newBookClose" aria-label="关闭">×</button>
      </header>
      <label class="field">
        <span>书名</span>
        <input name="title" type="text" maxlength="80" required placeholder="例如：重回九零：从厂办开始">
      </label>
      <div class="field-row">
        <label class="field">
          <span>题材</span>
          <select name="genre">
            <option value="niandai">年代</option>
            <option value="shuangwen">爽文</option>
          </select>
        </label>
        <label class="field">
          <span>目标平台</span>
          <select name="platform">
            <option value="qimao">七猫</option>
            <option value="zongheng">纵横</option>
            <option value="fanqie">番茄</option>
          </select>
        </label>
      </div>
      <div class="field-row">
        <label class="field">
          <span>目标字数</span>
          <input name="target_words" type="number" min="5000" step="1000" value="20000">
        </label>
        <label class="field">
          <span>每卷章数</span>
          <input name="vol_size" type="number" min="0" max="200" step="1" value="0">
        </label>
      </div>
      <p class="form-note">每卷章数填 0 = 不分卷；长篇建议按卷推进（卷末会先过卷级审查）。</p>
      <label class="field">
        <span>一句话卖点</span>
        <input name="one_line" type="text" maxlength="200" placeholder="一句话说清主角的困境与看点">
      </label>
      <p class="form-note">先写第一段，其余交给时间。AI 是否可用不影响你现在动笔。</p>
      <footer class="dialog-actions">
        <button type="button" class="button button-quiet" id="newBookCancel">取消</button>
        <button type="submit" class="button button-primary" id="newBookSubmit">开始写</button>
      </footer>
    </form>
  </dialog>

  <script type="module" src="/app.js?v=0.7.0"></script>
</body>
</html>
