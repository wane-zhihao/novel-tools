<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#faf6ee" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#14110e" media="(prefers-color-scheme: dark)">
  <title>制作台 · 签约工作台</title>
  <link rel="stylesheet" href="/studio.css">
</head>
<body>
  <a class="skip-link" href="#main">跳到主内容</a>

  <div class="app-shell">
    <aside class="sidebar">
      <header class="brand">
        <span class="brand-mark" aria-hidden="true">签</span>
        <span class="brand-copy">
          <strong>签约工作台</strong>
          <small>AI 自动写 · 人工投稿</small>
        </span>
        <a class="link-button back-home" href="/index.html" title="回到书房（日常写作界面）">回书房</a>
      </header>

      <div class="sidebar-actions">
        <button id="newBookButton" class="button button-primary" type="button">新建书</button>
        <button id="refreshBooksButton" class="button button-quiet" type="button" title="刷新书库">刷新</button>
      </div>

      <nav class="book-list" id="bookList" aria-label="书库"></nav>

      <footer class="sidebar-foot">
        <button id="settingsButton" class="link-button" type="button">Agent 配置</button>
        <button id="setupButton" class="link-button" type="button">路径设置</button>
        <p id="workspaceMeta" class="workspace-meta"></p>
      </footer>
    </aside>

    <main id="main" class="workspace" tabindex="-1">
      <div id="view" class="view" aria-live="polite"></div>
    </main>
  </div>

  <div id="toastRegion" class="toast-region" role="status" aria-live="polite" aria-atomic="true"></div>

  <dialog id="newBookDialog" class="dialog" aria-labelledby="newBookTitle">
    <form id="newBookForm" method="dialog">
      <header class="dialog-head">
        <h2 id="newBookTitle">新建书</h2>
        <button class="icon-button" type="button" id="newBookClose" aria-label="关闭">×</button>
      </header>
      <label class="field">
        <span>书名</span>
        <input name="title" type="text" maxlength="80" required placeholder="例如：重回九零：从厂办开始">
      </label>
      <div class="field-row">
        <label class="field">
          <span>题材</span>
          <select name="genre">
            <option value="niandai">年代</option>
            <option value="shuangwen">爽文</option>
          </select>
        </label>
        <label class="field">
          <span>目标字数</span>
          <input name="target_words" type="number" min="5000" step="1000" value="20000" required>
        </label>
        <label class="field">
          <span>最多章节</span>
          <input name="max_chapters" type="number" min="1" max="500" value="12" required>
        </label>
      </div>
      <label class="field">
        <span>目录名（可选）</span>
        <input name="folder" type="text" maxlength="60" placeholder="默认使用书名">
      </label>
      <p class="form-note">新书会创建在首个书库根目录下，并调用 <code>autopilot init</code> 初始化。</p>
      <footer class="dialog-actions">
        <button type="button" class="button button-quiet" id="newBookCancel">取消</button>
        <button type="submit" class="button button-primary" id="newBookSubmit">创建</button>
      </footer>
    </form>
  </dialog>

  <script type="module" src="/studio.js"></script>
</body>
</html>
